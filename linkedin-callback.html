<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Authorization - Ava Digital</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
    }
    .container {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 16px;
      padding: 48px;
      max-width: 480px;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    h1 { font-size: 24px; margin-bottom: 16px; color: #fff; }
    p { color: #94a3b8; margin-bottom: 24px; line-height: 1.6; }
    .btn {
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
    }
    .status {
      margin-top: 24px;
      padding: 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .status.success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
      display: block;
    }
    .status.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      display: block;
    }
    .token-display {
      margin-top: 16px;
      padding: 12px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      color: #64748b;
      max-height: 100px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔗 LinkedIn Integration</h1>
    <p>Connect your LinkedIn account to enable community tracking and lead scoring for VLG Signal Hub.</p>
    
    <button class="btn" id="authBtn" onclick="startAuth()">Authorize with LinkedIn</button>
    
    <div id="status" class="status"></div>
    <div id="tokenDisplay" class="token-display" style="display: none;"></div>
  </div>

  <script>
    // LinkedIn App Configuration
    const LINKEDIN_CONFIG = {
      clientId: '86h6bd9xxxxx', // Replace with your actual Client ID
      redirectUri: 'https://vikmehta333.github.io/mission-control/linkedin-callback',
      scope: 'r_member_postAnalytics r_organization_followers r_organization_social',
      state: generateState()
    };

    // Generate random state parameter for CSRF protection
    function generateState() {
      const array = new Uint8Array(32);
      crypto.getRandomValues(array);
      return Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
    }

    // Store state in sessionStorage
    sessionStorage.setItem('linkedin_oauth_state', LINKEDIN_CONFIG.state);

    function startAuth() {
      const authUrl = `https://www.linkedin.com/oauth/v2/authorization?` +
        `response_type=code&` +
        `client_id=${LINKEDIN_CONFIG.clientId}&` +
        `redirect_uri=${encodeURIComponent(LINKEDIN_CONFIG.redirectUri)}&` +
        `scope=${encodeURIComponent(LINKEDIN_CONFIG.scope)}&` +
        `state=${LINKEDIN_CONFIG.state}`;
      
      window.location.href = authUrl;
    }

    // Handle callback
    function handleCallback() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const state = urlParams.get('state');
      const error = urlParams.get('error');
      const errorDescription = urlParams.get('error_description');

      const statusEl = document.getElementById('status');
      const tokenEl = document.getElementById('tokenDisplay');
      const authBtn = document.getElementById('authBtn');

      if (error) {
        statusEl.className = 'status error';
        statusEl.textContent = `Error: ${error} - ${errorDescription}`;
        return;
      }

      if (code && state) {
        // Verify state matches
        const storedState = sessionStorage.getItem('linkedin_oauth_state');
        if (state !== storedState) {
          statusEl.className = 'status error';
          statusEl.textContent = 'Security error: State parameter mismatch. Please try again.';
          return;
        }

        // Success! Show the authorization code
        statusEl.className = 'status success';
        statusEl.innerHTML = '<strong>✓ Authorization successful!</strong><br>Copy the code below and send it to your backend to exchange for an access token.';
        
        tokenEl.style.display = 'block';
        tokenEl.textContent = `Authorization Code:\n${code}\n\nThis code expires in 5 minutes. Exchange it for an access token using your backend.`;
        
        authBtn.style.display = 'none';

        // Clear state from storage
        sessionStorage.removeItem('linkedin_oauth_state');
      }
    }

    // Check if we're on the callback page
    if (window.location.search.includes('code=') || window.location.search.includes('error=')) {
      handleCallback();
    }
  </script>
</body>
</html>
